<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep network matrix notation – UDL Fig. 4.6</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8f8f6;color:#1a1a18;padding:16px}
.layout{max-width:900px;margin:0 auto}
.panel{background:#fff;border:0.5px solid #ddd;border-radius:8px;padding:12px}
h2{font-size:15px;font-weight:500;margin-bottom:4px;color:#3a3a38}
.subtitle{font-size:12px;color:#888;margin-bottom:8px}
svg.fig{display:block;width:100%;height:auto}
.note{font-size:13px;color:#666;margin-top:8px;line-height:1.7}
.cite{font-size:11px;color:#999;margin-top:10px;line-height:1.5;border-top:0.5px solid #eee;padding-top:8px}
.cite a{color:#4a7cdc;text-decoration:none}
</style>
</head>
<body>
<div class="layout">
  <div class="panel">
    <h2>Deep network in matrix notation</h2>
    <p class="subtitle">D<sub>i</sub> = 3 inputs, K = 3 hidden layers of widths D<sub>1</sub> = 4, D<sub>2</sub> = 2, D<sub>3</sub> = 3, and D<sub>o</sub> = 2 outputs</p>
    <svg class="fig" id="fig" viewBox="0 0 800 470" role="img" aria-label="Diagram of a deep neural network with three hidden layers, labelled with its weight matrices and bias vectors"></svg>
    <p class="note" id="eqs"></p>
    <p class="cite">Adapted from Figure 4.6 of Simon J. D. Prince, <i>Understanding Deep Learning</i>, MIT Press, 2023.
      <a href="https://udlbook.github.io/udlbook/" target="_blank" rel="noopener">udlbook.github.io/udlbook</a>. Original figure licensed CC BY-NC-ND 4.0.</p>
  </div>
</div>
<script>
// ---- layer widths: edit here ----  [input, hidden..., output]
const DIMS = [3, 4, 2, 3, 2];
const SUB = '₀₁₂₃₄₅₆₇₈₉', SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sub = n => String(n).split('').map(c => SUB[+c]).join('');
const sup = n => String(n).split('').map(c => SUP[+c]).join('');

const C = {
  inFill:'#eaf4ee', inStroke:'#4a9e6a',
  hidFill:'#4a7cdc', hidStroke:'#4a7cdc',
  outFill:'#fbecec', outStroke:'#e05c5c',
  edge:'#b4b4b0', text:'#3a3a38', ann:'#888', mat:'#4a7cdc'
};
const L = DIMS.length, K = L - 2;
const X0 = 80, X1 = 720, CY = 255, GAP = 74, R = 20;
const xs = DIMS.map((_, i) => X0 + i * (X1 - X0) / (L - 1));
const ys = n => Array.from({length:n}, (_, i) => CY + (i - (n - 1) / 2) * GAP);
const Y = DIMS.map(ys);

let s = `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,1 L9,5 L0,9 z" fill="${C.edge}"/></marker>
  <marker id="barr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#d9845a"/></marker></defs>`;
function edge(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, Ln = Math.hypot(dx, dy), ux = dx / Ln, uy = dy / Ln;
  return `<line x1="${x1 + ux * R}" y1="${y1 + uy * R}" x2="${x2 - ux * (R + 2)}" y2="${y2 - uy * (R + 2)}" stroke="${C.edge}" stroke-width="1.3" marker-end="url(#arr)"/>`;
}

// column headers and vector labels
const name = i => i === 0 ? 'x' : i === L - 1 ? 'y' : 'h' + sub(i);
const head = i => i === 0 ? 'Input' : i === L - 1 ? 'Output' : 'Hidden layer ' + i;
const yTopMost = Math.min(...Y.map(a => a[0])), yBotMost = Math.max(...Y.map(a => a[a.length - 1]));
xs.forEach((x, i) => {
  s += `<text x="${x}" y="30" text-anchor="middle" font-size="14" font-weight="500" fill="${C.text}">${head(i)}</text>`;
  s += `<text x="${x}" y="${yBotMost + 62}" text-anchor="middle" font-size="16" font-weight="600" font-style="italic" fill="${C.text}">${name(i)}</text>`;
  s += `<text x="${x}" y="${yBotMost + 80}" text-anchor="middle" font-size="12" fill="${C.ann}">∈ ℝ${sup(DIMS[i])}</text>`;
});

// edges
for (let k = 0; k < L - 1; k++) Y[k].forEach(a => Y[k + 1].forEach(b => s += edge(xs[k], a, xs[k + 1], b)));

// bias "1" nodes (orange), their connections, and the parameter labels
const BIAS = '#d9845a';
for (let k = 0; k < L - 1; k++) {
  const xm = (xs[k] + xs[k + 1]) / 2, bx = xs[k] + 14, by = Y[k][0] - 52;
  Y[k + 1].forEach(t => {
    const dx = xs[k + 1] - bx, dy = t - by, Ln = Math.hypot(dx, dy), ux = dx / Ln, uy = dy / Ln;
    s += `<line x1="${bx + ux * 15}" y1="${by + uy * 15}" x2="${xs[k + 1] - ux * (R + 2)}" y2="${t - uy * (R + 2)}" stroke="${BIAS}" stroke-opacity="0.75" stroke-width="1.2" marker-end="url(#barr)"/>`;
  });
  s += `<circle cx="${bx}" cy="${by}" r="15" fill="#fff" stroke="${BIAS}" stroke-width="1.5"/><text x="${bx}" y="${by + 5}" text-anchor="middle" font-size="14" fill="${BIAS}">1</text>`;
  s += `<text x="${xm + 12}" y="62" text-anchor="middle" font-size="15" fill="${BIAS}"><tspan font-weight="600">β${sub(k)}</tspan> ∈ ℝ${sup(DIMS[k + 1])}</text>`;
  s += `<text x="${xm}" y="${yBotMost + 34}" text-anchor="middle" font-size="15" fill="${C.text}"><tspan font-weight="600">Ω${sub(k)}</tspan> ∈ ℝ${sup(DIMS[k + 1])}ˣ${sup(DIMS[k])}</text>`;
}

// nodes
xs.forEach((x, i) => Y[i].forEach((y, j) => {
  if (i === 0 || i === L - 1) {
    const inp = i === 0;
    s += `<circle cx="${x}" cy="${y}" r="${R}" fill="${inp ? C.inFill : C.outFill}" stroke="${inp ? C.inStroke : C.outStroke}" stroke-width="1.5"/>
      <text x="${x}" y="${y + 5}" text-anchor="middle" font-size="14" font-style="italic" fill="${C.text}">${inp ? 'x' : 'y'}${sub(j + 1)}</text>`;
  } else {
    s += `<circle cx="${x}" cy="${y}" r="${R}" fill="${C.hidFill}" stroke="${C.hidStroke}" stroke-width="1.5"/>
      <path d="M${x - 9},${y + 5} L${x},${y + 5} L${x + 8},${y - 5}" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>`;
  }
}));

document.getElementById('fig').innerHTML = s;

// equations under the figure
let eq = '';
for (let k = 1; k <= K; k++) eq += `<i>h</i><sub>${k}</sub> = a[β<sub>${k - 1}</sub> + Ω<sub>${k - 1}</sub>${k === 1 ? '<i>x</i>' : '<i>h</i><sub>' + (k - 1) + '</sub>'}] &nbsp;&nbsp; `;
eq += `<i>y</i> = β<sub>${K}</sub> + Ω<sub>${K}</sub><i>h</i><sub>${K}</sub>`;
document.getElementById('eqs').innerHTML = eq +
  `<br>Ω<sub>k</sub> multiplies the activations of one layer to give the pre-activations of the next, so it has one row per unit in the next layer and one column per unit in the previous layer. β<sub>k</sub> has the length of the layer it feeds into; it is drawn as the weights from a constant input of 1.`;

if (window.parent !== window) {
  const post = () => parent.postMessage({type:'udl-resize', height:document.documentElement.scrollHeight}, '*');
  new ResizeObserver(post).observe(document.body); post();
}
</script>
</body>
</html>
